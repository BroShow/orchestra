[project]
name = "tools"
version = "0.0.0"
description = "MCP tool servers (filesystem, web, shell)"
requires-python = ">=3.11"
dependencies = [
  "mcp",
  "httpx",
  "pydantic>=2.9",
  "ddgs",
  "trafilatura",
  "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]
