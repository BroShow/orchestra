[project]
name = "orchestrator"
version = "0.0.0"
description = "LangGraph-based agent orchestrator"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0",
  "langchain-core>=0.3",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg",
  "alembic",
  "qdrant-client",
  "structlog",
  "model-adapter",
  "tools",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]
