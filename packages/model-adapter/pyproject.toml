[project]
name = "model-adapter"
version = "0.0.0"
description = "Provider-agnostic LLM client (Ollama / OpenAI-compat / Anthropic-stub)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx",
  "langchain-core>=0.3",
  "langchain-ollama",
  "langchain-openai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model_adapter"]
