[project]
name = "orchestra"
version = "0.0.0"
description = "AI agent orchestration platform (PoC)"
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
  "apps/api",
  "packages/model-adapter",
  "packages/orchestrator",
  "packages/tools",
]

[tool.uv.sources]
model-adapter = { workspace = true }
orchestrator = { workspace = true }
tools = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "integration: tests that require a live Ollama or other external service",
]
