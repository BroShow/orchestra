[project]
name = "orchestra"
version = "0.0.0"
description = "AI agent orchestration platform (PoC)"
requires-python = ">=3.11"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-mock>=3.12",
  "mypy>=1.11",
  "ruff>=0.8",
]

[tool.uv.workspace]
members = [
  "apps/api",
  "packages/model-adapter",
  "packages/orchestrator",
  "packages/tools",
]

[tool.uv.sources]
model-adapter = { workspace = true }
orchestrator = { workspace = true }
tools = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "apps/api/tests"]
addopts = "-m 'not integration'"
markers = [
  "integration: tests that require a live Ollama or other external service",
]
