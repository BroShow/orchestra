name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.12

      - name: Install deps
        run: uv sync --all-packages

      # Integration tests that require Ollama are gated behind
      # @pytest.mark.integration; exclude them in CI. The MCP subprocess
      # tests are self-contained and run in the default pass.
      - name: Test (unit + MCP roundtrip)
        run: uv run pytest -q -m "not integration"

      - name: Lint
        run: uv run ruff check .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install deps
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: pnpm build
